name: Deploy

# CI 성공 후 Render 배포 훅 호출 (Netlify는 Git 연동으로 자동 배포)
# Repository secrets: RENDER_API_DEPLOY_HOOK, RENDER_WEB_DEPLOY_HOOK (Render > Settings > Deploy Hook)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy
        env:
          HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "RENDER_API_DEPLOY_HOOK not set, skip"; fi
      - name: Trigger Render frontend deploy
        env:
          HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "RENDER_WEB_DEPLOY_HOOK not set, skip"; fi
      - name: Wait & health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://fashionpick-api.onrender.com/health; then exit 0; fi
            sleep 20
          done
          echo "health check timeout (Render free tier cold start 가능)"; exit 0
